<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell Automaton</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <div class="layout">
      <div class="main">
        <div>
          <h4 style="text-align: center">CELL AUTOMATON</h4>
          <div id="container">
            <canvas id="app"></canvas>
          </div>
        </div>
        <div id="tools">
          <h4 id="generationDisplay">&nbsp;</h4>
          <section>
            <h6>PLAY</h6>
            <button id="next">NEXT</button>
            <button id="autoplay">AUTO</button>
            <button id="clear" style="background-color: greenyellow">CLEAR</button>
          </section>
          <button id="testCase" style="background-color: greenyellow">TEST_CASE</button>
        </div>
      </div>
    </div>
    <script type="module" src="index.js"></script>
  </body>
</html>
